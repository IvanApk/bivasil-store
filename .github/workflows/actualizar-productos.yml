# BIVA · Actualiza la web a partir de la planilla de productos y la publica.
#
# Corre: cada hora · a mano (Actions → "Actualizar productos" → Run workflow)
#        · y cada vez que se sube algo a main (fotos nuevas, cambios de texto…).
#
# Configuración (una sola vez):
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#     Nombre: SHEET_CSV_URL   Valor: el link "Publicar en la web → CSV" de la planilla
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

name: Actualizar productos

on:
  schedule:
    - cron: '17 * * * *'      # cada hora (hora UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.guardar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pillow openpyxl

      - name: Leer la planilla
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: python3 _tools/sync_sheet.py

      - name: Generar fotos, páginas y SEO
        run: python3 _tools/build.py

      - name: Guardar cambios en el repositorio
        id: guardar
        run: |
          git config user.name  "biva-bot"
          git config user.email "biva-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
            # las corridas horarias sin cambios no vuelven a publicar
            if [ "${{ github.event_name }}" = "schedule" ]; then echo "publicar=no" >> "$GITHUB_OUTPUT"; else echo "publicar=si" >> "$GITHUB_OUTPUT"; fi
          else
            git commit -m "Actualización automática de productos"
            git pull --rebase --autostash
            git push
            echo "publicar=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar sitio (sin carpetas internas)
        if: steps.guardar.outputs.publicar == 'si'
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude '_tools' --exclude '_fotos' --exclude '*.xlsx' --exclude '.huellas.json' \
            ./ _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.guardar.outputs.publicar == 'si'
        with:
          path: _site

  publicar:
    needs: construir
    if: needs.construir.outputs.publicar == 'si'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      # Avisa a Bing (que alimenta la búsqueda de ChatGPT, Copilot y otros) que hay páginas nuevas o cambiadas
      - name: Avisar a buscadores (IndexNow)
        continue-on-error: true
        run: |
          sleep 20
          URLS=$(curl -s https://bivasil.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | head -500 | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"bivasil.com\",\"key\":\"d96c737b09038f8f3ba9c69738993cf7\",\"keyLocation\":\"https://bivasil.com/d96c737b09038f8f3ba9c69738993cf7.txt\",\"urlList\":$URLS}"
